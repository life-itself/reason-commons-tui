[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reason-commons"
version = "0.1.0"
description = "A calm terminal workspace for making progress on a goal, one small loop at a time"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7", "textual>=6.2"]

[project.optional-dependencies]
test = ["behave>=1.3,<2", "pytest>=8,<9", "jsonschema>=4,<5"]
tui = []  # kept so older install commands still work; Textual is now a core dependency
mcp = ["mcp>=1.26,<2; python_version >= '3.10'"]

[project.scripts]
reason-commons = "reason_commons.adapters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reason_commons.domain" = ["CONTEXT.md"]
"reason_commons.adapters" = ["prompts/*.md", "contribution_skill/*.md", "*.ltp.yaml", "stories/*.yaml",
                             "stories/*.reasoncase", "tours/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
