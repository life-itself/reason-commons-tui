[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reason-commons"
version = "0.1.0"
description = "A durable reasoning case engine"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["behave>=1.3,<2", "pytest>=8,<9"]

[project.scripts]
reason-commons = "reason_commons.adapters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

