<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 846" width="900" height="846" role="img" aria-label="Prerequisite Tree. What stands in the way, and what has to come first? Change we make: Scale through depth: reach built around protected practice pockets. Obstacle: Practices stay tacit or spread shallowly. Intermediate objective: A maturity-rated, adaptable practice library. Obstacle: Values are hard to sustain without a container. Intermediate objective: An outward-facing pilot pocket runs. Obstacle: Delegating risks quality or a status hierarchy. Intermediate objective: Accountable, graduated stewardship. Obstacle: Agreeing in principle doesn&#x27;t change practice. Intermediate objective: Recurring practice at deeper levels. Obstacle: No next step; people may resist being funnelled. Intermediate objective: A transparent, consent-based entry path. Obstacle: A progress measure may be contested or reductive. Intermediate objective: A mixed-method progress measure is agreed. Obstacle: Goal, symptoms and arrows are not yet checked. Intermediate objective: A stewarded model, accepted for provisional use.">
