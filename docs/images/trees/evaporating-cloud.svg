<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 586" width="1010" height="586" role="img" aria-label="Evaporating Cloud. What conflict keeps us stuck, and which assumption is false? What we think we must do: Act like a movement now: scale, speed, message, accessibility. What we think we must do: Act like a monastery or lab now: depth, slowness, practice, rigour. Need: Be visible enough to attract people, resources and legitimacy. Need: Be embodied enough to represent the new paradigm with integrity. Shared objective: Durable cultural transformation. Change that dissolves the conflict: A broad public invitation built around deep, protected practice pockets: reach feeds practice, practice grows future facilitators.">
<title>Evaporating Cloud: What conflict keeps us stuck, and which assumption is false?</title>
<style>
  .k-breaker { --c: #0969da; }
