  .k-objective { --c: #1a7f37; }
  .k-want { --c: #8250df; }
  .box { fill: var(--c); fill-opacity: .07; stroke: var(--c); stroke-width: 1.5; }
  .k-constraint .box, .k-next .box { stroke-width: 3; }
  .kind { font: 600 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .06em; fill: var(--c); }
  .text { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .question { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #424a53; }
  .note { font: italic 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
  .edge { fill: none; stroke: #8b949e; stroke-width: 1.5; }
  .dashed { stroke-dasharray: 6 4; }
  .conflict { stroke: #cf222e; stroke-width: 2.5; stroke-dasharray: 7 5; }
  .risk { stroke: #cf222e; stroke-dasharray: 6 4; }
  #a path { fill: #8b949e; } #r path { fill: #cf222e; }
  @media (prefers-color-scheme: dark) {
    .k-breaker { --c: #4493f8; } .k-need { --c: #4493f8; } .k-objective { --c: #3fb950; } .k-want { --c: #ab7df8; }
    .text, .title { fill: #e6edf3; } .question { fill: #c9d1d9; } .note { fill: #9198a1; }
    .conflict, .risk { stroke: #f85149; } #r path { fill: #f85149; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
<text class="title" x="24" y="36">Evaporating Cloud</text>
<text class="question" x="24" y="60">What conflict keeps us stuck, and which assumption is false?</text>
<text class="note" x="986" y="36" text-anchor="end">arrows: in order to</text>
<path class="edge" d="M278.0 140.0 C322.0 140.0 322.0 140.0 366.0 140.0" marker-end="url(#a)"/>
<path class="edge" d="M278.0 374.0 C322.0 374.0 322.0 374.0 366.0 374.0" marker-end="url(#a)"/>
<path class="edge" d="M624.0 140.0 C678.0 140.0 678.0 257.0 732.0 257.0" marker-end="url(#a)"/>
<path class="edge" d="M624.0 374.0 C678.0 374.0 678.0 257.0 732.0 257.0" marker-end="url(#a)"/>
