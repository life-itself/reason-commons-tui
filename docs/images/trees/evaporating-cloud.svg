<g class="k-want">
<rect class="box" x="24" y="96" width="250" height="88" rx="9"/>
<text class="kind" x="36" y="116">WHAT WE THINK WE MUST DO</text>
<text class="text" x="36" y="138">Act like a movement now:</text>
<text class="text" x="36" y="156">scale, speed, message,</text>
<text class="text" x="36" y="174">accessibility</text>
</g>
<g class="k-want">
<rect class="box" x="24" y="330" width="250" height="88" rx="9"/>
<text class="kind" x="36" y="350">WHAT WE THINK WE MUST DO</text>
<text class="text" x="36" y="372">Act like a monastery or lab</text>
<text class="text" x="36" y="390">now: depth, slowness,</text>
<text class="text" x="36" y="408">practice, rigour</text>
</g>
<g class="k-need">
<rect class="box" x="370" y="96" width="250" height="88" rx="9"/>
<text class="kind" x="382" y="116">NEED</text>
<text class="text" x="382" y="138">Be visible enough to attract</text>
<text class="text" x="382" y="156">people, resources and</text>
<text class="text" x="382" y="174">legitimacy</text>
</g>
<g class="k-need">
<rect class="box" x="370" y="330" width="250" height="88" rx="9"/>
<text class="kind" x="382" y="350">NEED</text>
<text class="text" x="382" y="372">Be embodied enough to</text>
<text class="text" x="382" y="390">represent the new paradigm</text>
<text class="text" x="382" y="408">with integrity</text>
</g>
<g class="k-objective">
<rect class="box" x="736" y="222" width="250" height="70" rx="9"/>
<text class="kind" x="748" y="242">SHARED OBJECTIVE</text>
<text class="text" x="748" y="264">Durable cultural</text>
<text class="text" x="748" y="282">transformation</text>
</g>
<g class="k-breaker">
<rect class="box" x="370" y="460" width="616" height="70" rx="9"/>
<text class="kind" x="382" y="480">CHANGE THAT DISSOLVES THE CONFLICT</text>
<text class="text" x="382" y="502">A broad public invitation built around deep, protected practice pockets:</text>
<text class="text" x="382" y="520">reach feeds practice, practice grows future facilitators</text>
</g>
<text class="note" x="162" y="254" text-anchor="start">conflict</text>
<text class="note" x="24" y="476" text-anchor="start">Hidden assumption: both draw on the same scarce</text>
<text class="note" x="24" y="496" text-anchor="start">organiser capacity and cannot be staged or combined.</text>
<text class="note" x="24" y="568">Second Renaissance example, from reasoncommons/ltp/04-evaporating-clouds.md (labels shortened)</text>
