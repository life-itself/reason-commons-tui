<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 518" width="1020" height="518" role="img" aria-label="Transition Tree. What exactly do we do, and what should we see when it works? Action · do this first: Hold one time-boxed, stewarded review of the goal, the symptoms and the likely constraint. What we expect to see: A dated model: what is confirmed, what is disputed, who stewards it. Intermediate objective: A provisional shared model. Action: Draft one mixed-method definition of lasting adoption. What we expect to see: One measure that can be tested, not treated as the truth. Intermediate objective: A progress measure is agreed. Action: Prototype one clear next step from an open evening to a first practice. What we expect to see: Where people accept, decline, pause or leave, recorded without pressure. Intermediate objective: A consent-based entry path. Action: Run one short recurring-practice group. What we expect to see: Evidence about retention, practice and safety. Intermediate objective: Recurring practice.">
