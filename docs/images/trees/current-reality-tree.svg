<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 682" width="1060" height="682" role="img" aria-label="Current Reality Tree. Why are we not there yet? What causes what we see? Symptom: The group is busy, yet lasting adoption stays low. Symptom: Core organisers are overloaded and risk burnout. Symptom: Others admire the work but don&#x27;t reproduce it. Symptom: Pockets are hard to form and stay fragile. Symptom: Many resonate, but few enter sustained practice. Symptom: Newcomers don&#x27;t know the next step. Root cause · likely constraint: No reliable path from interest to practice. Root cause: Progress is not defined in a way people accept. Root cause: No agreed way to check and revise the map. Root cause: No regular rhythm of practice, action and learning.">
