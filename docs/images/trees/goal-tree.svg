<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 498" width="1056" height="498" role="img" aria-label="Goal Tree. What must be true for us to reach the goal? Goal: A wiser, weller, regenerative civilisation, co-initiated consciously. Critical success factor: People durably embody wiser views, values and practices. Critical success factor: The group learns and revises its strategy from evidence and objections. Critical success factor: Proven practices settle in pockets and can be passed on. Necessary condition: A clear path from first contact to lasting practice. Necessary condition: Practices can be repeated at deeper levels. Necessary condition: Progress is defined without reducing it to activity counts. Necessary condition: Strategy maps are living, challengeable commons. Necessary condition: Contributors grow into facilitators and stewards. Necessary condition: Dense practice groups get support and stay outward- facing.">
<title>Goal Tree: What must be true for us to reach the goal?</title>
