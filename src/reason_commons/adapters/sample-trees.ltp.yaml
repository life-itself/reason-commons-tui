  - id: prerequisite-io-6
    tree: prerequisite
    statement: A pilot pocket or sangha container operates with outward-facing service
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#IO-6
  - id: prerequisite-obs-7
    tree: prerequisite
    statement: Successful practices may remain tacit or spread as shallow copies
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#OBS-7
  - id: prerequisite-io-7
    tree: prerequisite
    statement: A maturity-rated replication library distinguishes principles from local forms
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#IO-7
  - id: prerequisite-inj-1
    tree: prerequisite
    statement: Organize a broad public invitation around deep, protected, practice-based pockets
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#INJ-1
  - id: transition-act-1
    tree: transition
    statement: Facilitate one bounded stewarded review of the goal, priority UDEs, and conversion-constraint
      hypothesis
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#ACT-1
  - id: transition-tr-1
    tree: transition
    statement: A dated model records confirmations, disputes, evidence gaps, a named steward, and the
      next review
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#TR-1
  - id: transition-io-1
    tree: transition
    statement: A stewarded, versioned model is accepted as good enough for provisional use
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#IO-1
  - id: transition-act-2
    tree: transition
    statement: Draft and review one mixed-method definition of a durable adoption event
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#ACT-2
  - id: transition-tr-2
    tree: transition
    statement: The group can test one candidate throughput measure without treating it as complete truth
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#TR-2
  - id: transition-io-2
    tree: transition
    statement: A mixed-method throughput definition and review protocol are accepted
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#IO-2
  - id: transition-act-3
    tree: transition
    statement: Prototype one consent-based next-step pathway from a real public contact into first practice
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#ACT-3
  - id: transition-tr-3
    tree: transition
    statement: The group observes where real participants accept, decline, or leave the entry pathway
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#TR-3
  - id: transition-io-3
    tree: transition
    statement: One transparent, consent-based entry pathway exists
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#IO-3
  - id: transition-act-4
    tree: transition
    statement: Run one short recurring-practice cohort as a documented learning experiment
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#ACT-4
  - id: transition-tr-4
    tree: transition
    statement: The group obtains retention, qualitative practice, safety, and learning evidence
    provenance:
