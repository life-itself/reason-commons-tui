# The Second Renaissance analysis from the reasoncommons guide (ltp/ltp-model.yaml, MIT licence),
# mapped to LTP 1.0 by scripts/build_sample_trees.py for the app's finished example.
ltp:
  schema_version: '1.0'
  project_id: second-renaissance-example
  title: 'Second Renaissance: why resonance is not becoming durable adoption'
  entities:
  - id: goal-nc-1
    tree: goal
    statement: Goal-relevant throughput is operationally defined without reducing transformation to activity
      counts
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#NC-1
  - id: goal-nc-2
    tree: goal
    statement: A transparent path connects first contact to sustained practice and contribution
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#NC-2
  - id: goal-nc-3
    tree: goal
    statement: Participants can repeat embodied practices at progressively deeper levels
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#NC-3
  - id: goal-nc-4
    tree: goal
    statement: Contributors can develop into facilitators and accountable stewards
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#NC-4
  - id: goal-nc-5
    tree: goal
    statement: Dense practice containers receive sangha support and remain outward-facing
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#NC-5
  - id: goal-nc-6
    tree: goal
    statement: Strategic maps are governed as living, challengeable, versioned commons
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#NC-6
  - id: goal-csf-1
    tree: goal
    statement: People durably embody wiser views, values, practices, and ways of acting
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#CSF-1
  - id: goal-csf-2
    tree: goal
    statement: The group learns and revises strategy through evidence, objections, and constraint review
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#CSF-2
  - id: goal-csf-3
    tree: goal
    statement: Proven practices stabilize in pockets and become responsibly transmissible
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#CSF-3
  - id: goal-g-1
    tree: goal
    statement: Co-initiate a conscious transformation toward a wiser, weller, regenerative civilization
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#G-1
  - id: current-reality-rc-0
    tree: current_reality
    statement: The group has no agreed process for validating and revising its strategic maps
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#RC-0
  - id: current-reality-rc-1
    tree: current_reality
    statement: The group lacks a reliable architecture that converts interest into practice, contribution,
      pocket formation, and replication
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#RC-1
  - id: current-reality-rc-2
    tree: current_reality
    statement: Throughput is not yet operationally defined and accepted
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#RC-2
  - id: current-reality-rc-3
    tree: current_reality
    statement: The group lacks a disciplined practice-action-learning and constraint-review cadence
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#RC-3
  - id: current-reality-ude-1
    tree: current_reality
    statement: Many people resonate with the ideas but few enter sustained practice
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#UDE-1
  - id: current-reality-ude-2
    tree: current_reality
    statement: The group is busy while durable-adoption throughput remains low
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#UDE-2
  - id: current-reality-ude-3
    tree: current_reality
    statement: Core organizers carry too much of the work and risk burnout
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#UDE-3
  - id: current-reality-ude-4
    tree: current_reality
    statement: New participants do not know the next step after initial contact
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#UDE-4
  - id: current-reality-ude-5
    tree: current_reality
    statement: Pockets are difficult to form and remain fragile or isolated
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#UDE-5
  - id: current-reality-ude-6
    tree: current_reality
    statement: Others may admire the work without reproducing it
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#UDE-6
  - id: conflict-opt-1
    tree: conflict
    statement: Act like a movement now by prioritizing scale, speed, message, and accessibility
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#OPT-1
  - id: conflict-opt-2
    tree: conflict
    statement: Act like a monastery or laboratory now by prioritizing depth, slowness, practice, and rigor
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#OPT-2
  - id: conflict-need-1
    tree: conflict
    statement: Become visible enough to attract people, resources, energy, and legitimacy
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#NEED-1
  - id: conflict-need-2
    tree: conflict
    statement: Become embodied enough to represent the proposed new paradigm with integrity
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#NEED-2
  - id: conflict-co-1
    tree: conflict
    statement: Increase durable cultural transformation
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#CO-1
  - id: future-reality-inj-0
    tree: future_reality
    statement: Establish a lightweight stewardship and revision protocol for the trees
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#INJ-0
  - id: future-reality-inj-1
    tree: future_reality
    statement: Organize a broad public invitation around deep, protected, practice-based pockets
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#INJ-1
  - id: future-reality-inj-2
    tree: future_reality
    statement: Define throughput as verified durable adoption using mixed quantitative and qualitative
      evidence
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#INJ-2
  - id: future-reality-inj-3
    tree: future_reality
    statement: Build a transparent, consent-based staged conversion architecture
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#INJ-3
  - id: future-reality-inj-4
    tree: future_reality
    statement: Install a practice-action-learning cadence with regular constraint review
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#INJ-4
  - id: future-reality-inj-5
    tree: future_reality
    statement: Create a graduated contributor, facilitator, and stewardship pathway
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#INJ-5
  - id: future-reality-inj-6
    tree: future_reality
    statement: Build dense practice containers connected to an outward-facing sangha
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#INJ-6
  - id: future-reality-inj-7
    tree: future_reality
    statement: Document only maturity-rated practices in a context-adaptable replication library
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#INJ-7
  - id: future-reality-de-1
    tree: future_reality
    statement: The group can distinguish durable transformation from visible activity
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#DE-1
  - id: future-reality-de-2
    tree: future_reality
    statement: More interested people enter and sustain embodied practice
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#DE-2
  - id: future-reality-de-3
    tree: future_reality
    statement: Leadership capacity grows without permanent founder bottlenecks
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#DE-3
  - id: future-reality-de-4
    tree: future_reality
    statement: Stable pockets form, mature, and stay connected to wider society
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#DE-4
  - id: future-reality-de-5
    tree: future_reality
    statement: Tested practices become teachable and independently reproducible
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#DE-5
  - id: future-reality-de-6
    tree: future_reality
    statement: The rate of verified durable adoption increases
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#DE-6
  - id: future-reality-nbr-1
    tree: future_reality
    statement: Throughput metrics crowd out subtle inner and relational transformation
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#NBR-1
  - id: future-reality-nbr-2
    tree: future_reality
    statement: A conversion pathway feels manipulative, extractive, or cult-like
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#NBR-2
  - id: future-reality-g-1
    tree: future_reality
    statement: Co-initiate a conscious transformation toward a wiser, weller, regenerative civilization
    provenance:
      path: reasoncommons/ltp/ltp-model.yaml#G-1
