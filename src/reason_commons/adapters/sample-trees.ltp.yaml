  assumptions:
  - id: a-goal-l-001
    relationship_id: goal-l-001
    statement: Civilizational transformation requires durable individual and collective embodiment.
  - id: a-goal-l-002
    relationship_id: goal-l-002
    statement: Strategy that cannot learn and revise will not sustain progress toward the goal.
  - id: a-goal-l-003
    relationship_id: goal-l-003
    statement: Durable cultural change requires transmissible pockets and institutions, not only individual
      practice.
  - id: a-current-reality-l-010
    relationship_id: current-reality-l-010
    statement: Without trusted map governance, a shared throughput definition remains premature or contested.
  - id: a-current-reality-l-011
    relationship_id: current-reality-l-011
    statement: Unclear throughput causes decisions to favor visible activity.
  - id: a-current-reality-l-012
    relationship_id: current-reality-l-012
    statement: Without a constraint-review cadence, activity is not reliably subordinated to system throughput.
  - id: a-current-reality-l-013
    relationship_id: current-reality-l-013
    statement: A missing staged pathway leaves new participants without an actionable next step.
  - id: a-current-reality-l-014
    relationship_id: current-reality-l-014
    statement: Missing next steps materially reduce entry into sustained practice.
  - id: a-current-reality-l-015
    relationship_id: current-reality-l-015
    statement: Too few sustained practitioners leaves recurring work concentrated on core organizers.
  - id: a-current-reality-l-016
    relationship_id: current-reality-l-016
    statement: Too few practitioners and facilitators limits the formation of dense containers.
  - id: a-current-reality-l-017
    relationship_id: current-reality-l-017
    statement: Fragile pockets provide too little evidence and capacity for independent replication.
  - id: a-current-reality-l-018
    relationship_id: current-reality-l-018
    statement: Weak replication materially limits durable-adoption throughput.
  - id: a-conflict-l-021
    relationship_id: conflict-l-021
    statement: Visibility requires prioritizing movement-like scale and accessibility now.
  - id: a-conflict-l-022
    relationship_id: conflict-l-022
    statement: Embodied integrity requires prioritizing laboratory-like depth and rigor now.
  - id: a-conflict-l-023
    relationship_id: conflict-l-023
    statement: Scale and depth compete for the same scarce organizer capacity and cannot be sequenced
      or integrated.
  - id: a-future-reality-l-024
    relationship_id: future-reality-l-024
    statement: A governed model makes goal-relevant progress more discernible.
  - id: a-future-reality-l-025
    relationship_id: future-reality-l-025
    statement: A mixed-method throughput definition improves decisions without becoming the goal.
  - id: a-future-reality-l-026
    relationship_id: future-reality-l-026
    statement: A consent-based staged pathway increases practice entry without damaging trust.
  - id: a-future-reality-l-027
    relationship_id: future-reality-l-027
    statement: Short learning cycles reveal and improve the current constraint.
  - id: a-future-reality-l-028
    relationship_id: future-reality-l-028
    statement: Apprenticeship and review distribute leadership while preserving quality.
  - id: a-future-reality-l-029
    relationship_id: future-reality-l-029
    statement: Repeated interaction and sangha support stabilize practice into lived culture.
  - id: a-future-reality-l-030
    relationship_id: future-reality-l-030
    statement: Mature documentation allows responsible adoption without founder presence.
  assessments: []
  changes: []
