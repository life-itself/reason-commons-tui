  speaker: David Joseph
  title: Trees at three scales
  summary: Trees need not have one top level that everyone must conform to. There could be individual, group and
    everyone trees; the Second Renaissance is one group among many, groups with aligned visions could graft their
    trees, and an everyone tree could emerge rather than be imposed.
  source: David Joseph's account of June and July 2026, written as background for an AI assistant (reasoncommons
    repository, docs/prompts/LTP_BACKGROUND_PROMPT.md), item 5
  where: reasoncommons repository, docs/prompts/LTP_BACKGROUND_PROMPT.md
  words: |-
    … As mentioned before, I've been realizing that the trees have different scales/levels of resolution. And then it dawned on me that 2R's version of the trees, as we've defined them, don't necessarily have to be taken as the top level version to which other ambitions must conform. Instead there could be different levels:

    individual
    group
    everyone

    2R could fit into the group bracket. Some other group with an aligned but different vision could also have a group-level set of trees. Then, the possibility of grafting or combining these visions in some way would arise. Instead of pre-defining the everyone tree, it could be arrived at through emergence.
  add:
