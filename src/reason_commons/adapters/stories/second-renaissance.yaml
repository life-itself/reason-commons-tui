- date: '2026-08-30T12:00:00+02:00'
  dated: day
  speaker: Rufus Pollock
  title: The forum doesn't remember
  summary: 'An explainer for the movement names what goes wrong: a claim buried in a long white paper or a forum
    thread has no address, so nobody can dispute or improve it precisely. It sharpens the conversation-or-structure
    conflict: the assumption that structure must be added by the contributor, at the moment they contribute, is
    no longer true in the age of AI.'
  source: Explainer, The Forum Doesn't Remember, and Doesn't Cumulate (30 August)
  where: reasoncommons repository, explainers/second-renaissance-plain/index.md
  words_note: Text of the explainer Rufus published.
  words: |-
    … But a claim buried in a paragraph on page forty has no address. You can't point at it, so you can't disagree with it precisely or improve it.

    …

    Both sides serve the same goal, so rather than pick one, look for the assumption that makes them look opposed: the structure has to be put there by a person, probably the person contributing, at the moment they contribute.

    That assumption is no longer true in the age of AI.

    …

    So let the conversation be a conversation. …

    Afterwards, separately, AI reads the thread against the tree and proposes where things belong: this sentence supports that condition, this one challenges that link, this one is a claim the tree has nowhere to put yet.

    Then a person or a small group, with AI assistance where it helps, decides what actually merges into the tree.
  reword:
  - id: talk-objective
    new: talk-compounds
    statement: A group whose thinking compounds toward its goal
  - id: talk-bridge
    new: talk-separate
    statement: 'Separate the acts: the conversation stays a conversation; afterwards AI reads it against the trees
      and proposes where each point belongs; a person or small group, with AI assistance where it helps, decides
      what merges'
  add:
  - id: ude-no-address
    tree: current_reality
    role: undesirable_effect
    statement: A precise claim in a forum thread or a long white paper has no address, so nobody can dispute or
      improve it
  links:
  - from: ude-no-address
    to: ude-recurs
    relation: contributes_to
  question: Can AI's placement be trusted enough for a group to review it?
