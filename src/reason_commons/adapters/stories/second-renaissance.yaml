  speaker: David Joseph
  title: The strategy becomes a goal tree
  summary: David opens a forum series that translates the movement's white papers into the Logical Thinking Process.
    The goal comes first, with eight conditions that must all hold for a Second Renaissance to be more than an idea.
  source: 'Forum, 2R Goal Tree: what is expected, post 1 (5 June)'
  where: https://forum.secondrenaissance.net/t/2r-goal-tree-what-is-expected/746
  words: |-
    This will be the first in a series of posts concerning the Logical Thinking Process and how it can help us organize our research efforts towards a goal:

    Co-initiate a Second Renaissance: a conscious transformation of foundational views, values, practices, and institutions toward a wiser, weller, regenerative civilization.

    …

    As I see it, we can assume we have a common goal, whether or not it has been explicated well.
    Then we can asssume there is some form of throughput - measurable progress towards this goal. Evidence that somehow, what we are doing will result in what we desire.
