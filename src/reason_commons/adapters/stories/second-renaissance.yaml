- date: '2026-06-06T00:07:00+00:00'
  speaker: Robert Bunge
  title: 'Robert: we''re a school'
  summary: 'Robert likes the idea of a 2R operating system and the funnel, and expects "define throughput" to tie
    people in knots. He offers his own reading: the movement is a school, its throughput ideas becoming workable
    and newcomers becoming practitioners, and the rest of the chain is educational administration, where he has
    credentials and years of experience.'
  source: 'Forum, 2R Prerequisite Tree: How to Cause the Change?, post 3 (6 June)'
  where: https://forum.secondrenaissance.net/t/2r-prerequisite-tree-how-to-cause-the-change/750
  words: |-
    On the "Objective" section above, I like idea of a 2R operating system. That has both literal and metaphorical resonance for me!

    …

    Moving to the "key dependency chain" section, the very first point - "define throughput" is likely going to have a lot of people all tied up in knots! We're not exactly Adam Smith's pin factory, after all! My take is, we're basically in the education business, with a special focus on R&D and training for cultural transformation. The "throughput" is raw information to workable ideas, along with a parallel throughput of people unfamiliar with any of it to advanced theorists and practitioners of all of it. We're a school. Without the stupid stuff like grades and tuition. If you buy what I selling about 2R being a "school", then the rest of the key dependency chain is literally educational administration, a vertical in which I have both formal credentials and years of experience. Again, there is no wheel to reinvent here. Just wheels to put our collective shoulders to!
  add:
  - id: robert-school
    tree: prerequisite
    role: observation
    basis: participant_report
    statement: 'Throughput for a movement that is a school: raw information becoming workable ideas, and newcomers
      becoming advanced theorists and practitioners'
  - id: robert-administration
    tree: prerequisite
    role: observation
    basis: participant_report
    statement: The rest of the key dependency chain is educational administration, with no wheel to reinvent
  links:
  - from: robert-school
