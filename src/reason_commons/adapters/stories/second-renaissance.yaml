# The Second Renaissance commons: how its shared reasoning came to be, step by step.
#
# Each chapter becomes one saved revision of a goal, in order, on its real date,
# attributed to the person who said it. `words` is what that person actually
# wrote (quoted from the source named beside it); `summary` is the editor's
# one-paragraph narration; the tree changes are the editor's reading of what the
# words changed, inferred where the sources only record the outcome. Quotes keep
# the writers' own spelling, and omissions are marked with …. Where the words are a
# document's text rather than something the speaker wrote, `words_note` says so.
#
# Sources: the public forum threads "2R Goal Tree: what is expected" (/t/746) and
# "2R Prerequisite Tree: How to Cause the Change?" (/t/750) on forum.secondrenaissance.net,
# David Joseph's account of June-July 2026, written as background for an AI assistant
# (docs/prompts/LTP_BACKGROUND_PROMPT.md in the reasoncommons repository; it quotes
# forum and Discord messages),
# and the reasoncommons repository's files and Git history up to 28 September 2026.
#
# DRAFT FOR CONSENT. The people named here (David Joseph, Rufus Pollock, Robert Bunge,
# curious_reader, and Margaret, who is mentioned) have not yet agreed to be quoted in
# the product. The Discord messages and the account are not public. Do not publish
# until they have agreed.

name: "Second Renaissance: a theory of change people can argue with"
as_of: "28 September 2026"
reader: "You (reading)"
intro: >-
  This is the Second Renaissance's shared reasoning: a movement's strategy written as
  trees, then argued with, reorganised and partly rebuilt by the people working on it.
  Step back through how it got here, or look at the one action it says comes next.
fidelity: >-
  Quoted words are real and dated from their sources. Tree changes are an editor's
  reading of what each step changed. Dates marked ≈ are approximate.

