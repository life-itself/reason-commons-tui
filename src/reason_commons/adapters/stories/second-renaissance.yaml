  speaker: David Joseph
  title: Real needs before beautiful solutions
  summary: 'David agrees with Robert: ideas succeed when they meet real needs, not because they are beautiful. The
    objection now sits on the condition it is about, with support.'
  source: 'Forum, 2R Goal Tree: what is expected, post 4 (6 June)'
  where: https://forum.secondrenaissance.net/t/2r-goal-tree-what-is-expected/746
  words: 'Very much agreed, and this is one of those points that is often overlooked by theoreticians and would-be
    entrepreneurs everywhere. … The real test is: does your idea align with pull forces? What pulls it into existence?
    … The pull view is simply more correct, and we ought to first care about aligning ourselves with real needs–not
    advocating for beautiful solutions that need to convince.'
