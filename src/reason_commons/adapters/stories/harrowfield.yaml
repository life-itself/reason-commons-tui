- date: '2025-11-06T16:00:00+00:00'
  speaker: Ruth Okonjo
  title: Three more, for it to be enough
  summary: Drawing the future tree shows three more changes are needed for it to work.
  source: Ruth's notebook, week five
  words: |-
    On its own it isn't enough. Three more changes. Every ward holds a 15-minute board round at 08:30 that marks each patient green, amber or red, and every red names its blocker and an owner; one daily flow meeting replaces the four bed meetings. We stop reporting occupancy as efficiency and report waiting bed-days, discharges by hour and planned operations done. And patients likely to need care after discharge are referred to the county on day one.

    If the waits inside the hospital halve and the social-care waits fall by a third, about ten points of occupied beds come free: from 97% to about 87%, with no new beds.
  add:
