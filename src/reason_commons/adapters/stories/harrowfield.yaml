- date: '2025-11-10T12:00:00+00:00'
  speaker: Dr Helen Marsh
  title: If a nurse gets it wrong
  summary: Dr Marsh names the risk that would end the change, and what would keep it from happening.
  source: Medical staff committee, 10 November
  words: |-
    Here's what would end it. A nurse discharges a patient on vague criteria, or because she felt pressed to, the patient deteriorates, and every consultant in the building goes back to deciding on the day. So the criteria have to be measurable, any doubt means escalate with no penalty, and I want every criteria-led discharge audited weekly for two months, with 7-day readmissions plotted against last year.
  add:
