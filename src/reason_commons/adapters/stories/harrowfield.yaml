    tree: future_reality
    role: undesirable_effect
    statement: A nurse discharges a patient who deteriorates; consultants lose trust and go back to deciding on
      the day
  - id: trim-trust
    tree: future_reality
    role: injection
    statement: Criteria are measurable, any doubt means escalate with no penalty, and every criteria-led
      discharge is audited weekly for two months
  links:
  - from: inj-criteria
    to: nb-trust
    relation: contributes_to
    assumption: Criteria are vague, or a nurse feels pressed to discharge
  - {from: trim-trust, to: nb-trust, relation: challenges}
  question: What else could go wrong?

- date: '2025-11-11T16:00:00+00:00'
  speaker: Ruth Okonjo
  title: The branch that would undo everything
  summary: Asking every group what could go wrong finds five more risks. One matters most, because no single
    department can see it and it looks like prudence.
  source: Ruth's notebook, week six
  words: |-
    Five more ways it could go wrong, from five different rooms. Managers chase date "accuracy" and dates become targets. Pharmacy gets every prescription at eight in the morning. Ward nurses face discharges, the medicine round and the first admissions all at once. Families aren't ready at ten, so patients wait anyway.

    And the one that matters most, because nobody inside one department can see it and it looks like prudence: finance sees empty beds at noon, closes a ward, occupancy is back at 97% and everything reverts. Before the pilot, the board has to commit the beds we free to the waiting list and the buffer.
  add:
  - id: nb-targets
    tree: future_reality
    role: undesirable_effect
    statement: "Expected dates become targets: patients are pushed out early, or dates are padded so they are
      always met"
  - id: trim-targets
    tree: future_reality
    role: injection
    statement: "The date is a plan, not a target: measure why reds happen, never whether dates were hit"
  - id: nb-harvest
    tree: future_reality
    role: undesirable_effect
    statement: "Freed beds are harvested as savings: a ward closes and occupancy returns to 97%"
  - id: trim-harvest
    tree: future_reality
    role: injection
    statement: Before the pilot, the board commits freed beds to the planned-operations waiting list and to the
      buffer
  - id: nb-pharmacy
    tree: future_reality
    role: undesirable_effect
    statement: "Pharmacy becomes the new bottleneck, with every discharge prescription demanded at 08:00"
  - id: trim-pharmacy
    tree: future_reality
    role: injection
    statement: "Pharmacy gets tomorrow's list by 16:00 and prepares the medicines the afternoon before"
  - id: nb-pileup
    tree: future_reality
    role: undesirable_effect
    statement: Ward nurses face discharges, the medicine round and the first admissions all at once
  - id: trim-pileup
    tree: future_reality
    role: injection
    statement: "A staffed discharge lounge, with patient transport spread across 09:00 to 12:00"
  - {id: nb-families, tree: future_reality, role: undesirable_effect, statement: "Families are not ready at 10:00, so patients wait anyway"}
  - id: trim-families
    tree: future_reality
    role: injection
    statement: The expected date is shared with the patient and family at admission
  links:
